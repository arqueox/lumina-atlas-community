<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0E0F0C">
  <meta name="description" content="Lumina Atlas — televisão, filmes e séries com o teu fornecedor IPTV.">
  <title>Lumina Atlas</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Manrope:wght@500..800&display=swap">
  <link rel="stylesheet" href="styles.css?v=a2">
  <script>
    // Theme before the first paint: saved choice, else the system's.
    (()=>{let t='auto';try{t=localStorage.getItem('lumina_atlas_theme')||'auto'}catch{}
      const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme=dark?'dark':'light'})();
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="i-live" viewBox="0 0 24 24"><rect x="3.5" y="7" width="17" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="m8.5 3.5 3.5 3.5 3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-movie" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8 4v16M16 4v16M4 9h4M4 15h4M16 9h4M16 15h4" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-series" viewBox="0 0 24 24"><rect x="3.5" y="8" width="13" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M7.5 5h10a3 3 0 0 1 3 3v8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 4 2.4 5 5.4.7-4 3.7 1 5.4-4.8-2.7-4.8 2.7 1-5.4-4-3.7 5.4-.7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-star-fill" viewBox="0 0 24 24"><path d="m12 4 2.4 5 5.4.7-4 3.7 1 5.4-4.8-2.7-4.8 2.7 1-5.4-4-3.7 5.4-.7z" fill="currentColor"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-theater" viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M6 18l1.6-1.6M16.4 7.6 18 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.4-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z" fill="currentColor"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  </svg>

  <header class="top">
    <div class="top-copy">
      <h1 id="viewTitle">Início</h1>
      <p id="status" class="status"><i></i><span>A ligar…</span></p>
    </div>
    <div class="top-actions">
      <button class="round soft" id="searchButton" aria-label="Pesquisar"><svg><use href="#i-search"/></svg></button>
      <button class="round soft" id="themeButton" aria-label="Alternar tema claro e escuro"><svg><use href="#i-moon"/></svg></button>
      <button class="round soft" id="theaterButton" aria-label="Abrir em modo Tesla Theater" title="Tesla Theater"><svg><use href="#i-theater"/></svg></button>
      <button class="round ink" id="settingsButton" aria-label="Sessão (PIN)"><svg><use href="#i-lock"/></svg></button>
    </div>
  </header>

  <main id="app" aria-live="polite">
    <section id="tabs" class="segmented hidden" role="tablist"></section>
    <section id="grid"></section>
    <section id="empty" class="welcome hidden">
      <div class="welcome-tile">
        <small>Televisão · Atlas</small>
        <h2>Lumina<br>Atlas</h2>
        <p>Introduz o PIN privado para entrar.</p>
      </div>
      <button class="pill ink big" id="emptySetup">Introduzir PIN</button>
    </section>
    <section id="loading" class="loading hidden"><i></i><span>A preparar a Lumina…</span></section>
  </main>

  <nav class="dock" aria-label="Navegação principal">
    <button class="dock-btn active" data-view="home"><svg><use href="#i-home"/></svg><span>Início</span></button>
    <button class="dock-btn" data-view="live"><svg><use href="#i-live"/></svg><span>Direto</span></button>
    <button class="dock-btn" data-view="movies"><svg><use href="#i-movie"/></svg><span>Filmes</span></button>
    <button class="dock-btn" data-view="series"><svg><use href="#i-series"/></svg><span>Séries</span></button>
    <button class="dock-btn" data-view="favorites"><svg><use href="#i-star"/></svg><span>Favoritos</span></button>
  </nav>

  <dialog id="settingsDialog" class="sheet">
    <form method="dialog" id="settingsForm">
      <div class="sheet-head"><div><small class="kicker">Lumina Atlas</small><h2>Entrar</h2></div><button class="round soft" value="cancel" aria-label="Fechar"><svg><use href="#i-x"/></svg></button></div>
      <input id="deviceToken" class="pin-input" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" required>
      <p class="hint">O PIN cria uma sessão privada neste browser; as credenciais IPTV ficam no servidor.</p>
      <div class="sheet-actions"><button class="pill soft" value="cancel">Cancelar</button><button class="pill ink" id="saveSettings" value="default">Entrar</button></div>
    </form>
  </dialog>

  <dialog id="searchDialog" class="sheet search-sheet">
    <form method="dialog">
      <div class="sheet-head"><h2>Pesquisar</h2><button class="round soft" value="cancel" aria-label="Fechar"><svg><use href="#i-x"/></svg></button></div>
      <input id="searchInput" class="search-input" type="search" placeholder="Canal, filme ou série…" autocomplete="off">
      <div id="searchResults" class="search-results"></div>
    </form>
  </dialog>

  <dialog id="detailDialog" class="detail"><button class="round soft detail-close" aria-label="Fechar"><svg><use href="#i-x"/></svg></button><div id="detailBody"></div></dialog>

  <dialog id="playerDialog" class="player-shell">
    <div class="player-top">
      <div class="player-copy"><strong id="playerTitle">Lumina Atlas</strong><span id="playerSubtitle"></span></div>
      <div class="player-actions">
        <button id="fullscreenButton" class="pill dark"><svg><use href="#i-expand"/></svg>Ecrã inteiro</button>
        <button id="audioMode" class="pill dark"><svg><use href="#i-sound"/></svg>Som apenas</button>
        <button id="subtitleButton" class="round dark hidden" aria-label="Carregar legendas" title="Carregar legendas">CC</button>
        <button id="playerClose" class="round lime" aria-label="Fechar"><svg><use href="#i-x"/></svg></button>
      </div>
    </div>
    <video id="player" controls playsinline></video>
    <div id="playerNotice" class="player-notice hidden"></div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
  <script src="app.js?v=a5"></script>
</body>
</html>
